<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EEF8"/>
      <stop offset="55%" stop-color="#DDD1EC"/>
      <stop offset="100%" stop-color="#C3B1DC"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="18"/></clipPath>
    <style>
      .wave1 { animation: drift 14s linear infinite; }
      .wave2 { animation: drift 9s linear infinite reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
      .dot { animation: pulse 3s ease-in-out infinite; }
      .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.8s; } .d5 { animation-delay: 2.4s; }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
      .name { font: 700 54px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3D2B56; animation: rise 1.2s ease-out both; }
      .tag  { font: 600 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6E5A8C; letter-spacing: 1px; animation: rise 1.2s ease-out .4s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <g fill="#9D8AC2">
      <circle class="dot" cx="90" cy="60" r="4"/>
      <circle class="dot d2" cx="180" cy="110" r="3"/>
      <circle class="dot d3" cx="1050" cy="55" r="4"/>
      <circle class="dot d4" cx="1120" cy="120" r="3"/>
      <circle class="dot d5" cx="980" cy="95" r="2.5"/>
      <circle class="dot d3" cx="250" cy="50" r="2.5"/>
    </g>
    <g stroke="#9D8AC2" stroke-opacity=".4" stroke-width="1">
      <line x1="90" y1="60" x2="180" y2="110"/><line x1="180" y1="110" x2="250" y2="50"/>
      <line x1="980" y1="95" x2="1050" y2="55"/><line x1="1050" y1="55" x2="1120" y2="120"/>
    </g>
    <path class="wave1" fill="#B09FCF" fill-opacity=".45"
      d="M0 205 Q150 175 300 205 T600 205 T900 205 T1200 205 T1500 205 T1800 205 V260 H0 Z"/>
    <path class="wave2" fill="#FFFFFF" fill-opacity=".45"
      d="M0 225 Q150 250 300 225 T600 225 T900 225 T1200 225 T1500 225 T1800 225 V260 H0 Z"/>
    <text class="name" x="600" y="112" text-anchor="middle">Rithika Sankar Rajeswari</text>
    <text class="tag" x="600" y="152" text-anchor="middle">DATA SCIENCE  ·  ML / AI ENGINEERING  ·  DATA ENGINEERING  ·  ANALYTICS &amp; BI</text>
  </g>
</svg>
